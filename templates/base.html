{% load static %}<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SD Recruitment | Connecting Talent with Opportunity{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}SD Recruitment connects businesses with the right people and supports candidates in finding opportunities to grow their careers.{% endblock %}">
  <link rel="canonical" href="{{ site_url }}{{ request.path }}">
  <meta name="theme-color" content="#304B98">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ business.name }}">
  <meta property="og:title" content="{% block og_title %}{{ business.name }} – Connecting Talent with Opportunity{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Recruitment support for employers and career support for candidates.{% endblock %}">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}{% static 'images/logo-full.png' %}">
  <meta property="og:locale" content="en_AU">

  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ asset_v }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "EmploymentAgency",
    "name": "{{ business.name }}",
    "slogan": "{{ business.tagline }}",
    "url": "{{ site_url }}/",
    "logo": "{{ site_url }}{% static 'images/logo-full.png' %}"{% if business.phone_tel %},
    "telephone": "{{ business.phone_tel }}"{% endif %}{% if business.email %},
    "email": "{{ business.email }}"{% endif %}{% if business.address %},
    "address": "{{ business.address }}"{% endif %}{% if linkedin_url %},
    "sameAs": ["{{ linkedin_url }}"]{% endif %}
  }
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "includes/icons.html" %}
  <a class="skip-link" href="#main">Skip to content</a>

  {% include "includes/header.html" %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include "includes/footer.html" %}

  <script src="{% static 'js/main.js' %}?v={{ asset_v }}" defer></script>
</body>
</html>
