<div class="field{% if field.errors %} field--error{% endif %}{% if wide %} field--wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% else %} <span class="opt">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field__help" id="{{ field.auto_id }}_help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
