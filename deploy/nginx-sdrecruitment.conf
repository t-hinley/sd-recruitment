# Nginx site for SD Recruitment (Django). Copy to /etc/nginx/sites-available/sdrecruitment
# Only answers for the names below; other sites on the server (SD Travels, SD Commercial) are not affected.
# Uploaded resumes live in /srv/sdrecruitment/private_media and are deliberately NOT served here:
# staff download them through the admin only.
# Certbot adds the HTTPS (port 443) part to this file automatically.

server {
    listen 80;
    listen [::]:80;
    server_name recruitment.example.com.au www.recruitment.example.com.au;   # replace with the real domain(s)

    client_max_body_size 8m;   # resumes up to 5 MB plus the rest of the form

    access_log /var/log/nginx/sdrecruitment.access.log;
    error_log  /var/log/nginx/sdrecruitment.error.log;

    # CSS, JavaScript, fonts and images (made by "collectstatic")
    location /static/ {
        alias /srv/sdrecruitment/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Everything else goes to the Django app (Gunicorn), through a private socket file (no port used)
    location / {
        proxy_pass http://unix:/run/sdrecruitment/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
